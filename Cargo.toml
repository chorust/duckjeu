[package]
name = "duckjeu"
version = "0.1.0"
edition = "2021"
description = "DuckJeu — JEV-powered judgment for DuckDB"
license = "MIT"
publish = false

[workspace]
members = ["crates/judgment-core"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true
opt-level = 3

[dependencies]
duckjeu-judgment-core = { path = "crates/judgment-core" }
duckdb = { version = "~1.10505.0", default-features = false, features = [
    "loadable-extension",
] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[build-dependencies]
cc = "1.4.6"
